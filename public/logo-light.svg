<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" fill="none" viewBox="0 0 256 256"><style>@keyframes pulse{0%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}50%{transform:scale(1.12);filter:drop-shadow(0 0 6px currentColor)}}.node{transform-origin:center;animation:pulse 2.8s ease-in-out infinite}.node.delay-1{animation-delay:.2s}.node.delay-2{animation-delay:.4s}svg:hover .node{animation-duration:1.6s}</style><path stroke="#334155" stroke-linecap="square" stroke-width="15" d="M88 48 C72 48, 72 64, 72 80 V96 C72 112, 56 112, 56 128 C56 144, 72 144, 72 160 V176 C72 192, 72 208, 88 208"/><path stroke="#334155" stroke-linecap="square" stroke-linejoin="round" stroke-width="15" d="M168 48 C184 48, 184 64, 184 80 V96 C184 112, 200 112, 200 128 C200 144, 184 144, 184 160 V176 C184 192, 184 208, 168 208"/><line x1="104" x2="128" y1="96" y2="128" stroke="#64748B" stroke-width="4"/><line x1="152" x2="128" y1="96" y2="128" stroke="#64748B" stroke-width="4"/><line x1="128" x2="128" y1="168" y2="128" stroke="#64748B" stroke-width="4"/><circle cx="104" cy="96" r="8" fill="#12FF4B" class="node" style="color:#12ff4b"/><circle cx="152" cy="96" r="8" fill="#FF3B3B" class="node delay-1" style="color:#ff3b3b"/><circle cx="128" cy="128" r="10" fill="#00E5FF" class="node delay-2" style="color:#00e5ff"/><circle cx="128" cy="168" r="8" fill="#A259FF" class="node delay-1" style="color:#a259ff"/></svg>